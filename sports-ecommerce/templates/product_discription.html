
{% load static %}

<!-- Product Details -->
<section class="py-12 bg-gray-50">

    <div class="max-w-7xl mx-auto px-5">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-start">

            <!-- Product Image -->
            <div class="bg-white rounded-xl shadow-md p-6">

                {% if product.image %}
                    <img
                        src="{{ product.image.url }}"
                        alt="{{ product.name }}"
                        id="ProductImg"
                        class="w-full h-[500px] object-contain rounded-lg"
                    >
                {% else %}
                    <div class="w-full h-[500px] bg-gray-200
                                flex items-center justify-center rounded-lg">
                        <p class="text-gray-500">No Image Available</p>
                    </div>
                {% endif %}

            </div>


            <!-- Product Information -->
            <div class="bg-white rounded-xl shadow-md p-8">

                <!-- Product Category / Name -->
                <p class="text-gray-500 text-sm mb-3">
                    {{ product.name }}
                </p>

                <!-- Product Title -->
                <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-5">
                    {{ product.name }}
                </h1>

                <!-- Price -->
                <h4 class="text-2xl font-bold text-blue-600 mb-6">
                    ₹{{ product.price }}
                </h4>
        <!-- Quantity -->
                <label class="block text-gray-700 font-semibold mb-2">
                    Quantity
                </label>
               
<form method="post" action="{% url 'add_to_cart' %}" class="flex items-center gap-3">
    {% csrf_token %}

    <input type="hidden" value="{{ product.id }}" name="product_id">

    <input
        type="hidden"
        name="product_id"
        value="{{product.id}}"
        >
    <input
      type="number"
      name="quantity"
      value="1"
      min="1"
    
    
        class="w-20 rounded-lg border border-gray-300 px-3 py-2 text-center
               focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200">

    <button
        type="submit"
        class="rounded-lg bg-blue-600 px-5 py-2 font-semibold text-white
               transition hover:bg-blue-700 focus:outline-none focus:ring-2
               focus:ring-blue-300"
    >
        Add To Cart
    </button>
</form>
                <!-- Product Details -->
                <div class="border-t pt-6">

                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        Product Details
                        
                    </h3>

                    <p class="text-gray-600 leading-relaxed">
                        {{ product.description }}
                    </p>

                </div>

            </div>

        </div>

    </div>

</section>
