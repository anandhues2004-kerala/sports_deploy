{% extends 'blank.html' %}
{% load static %}

{% block banner %}
{% endblock banner %}

{% block content %}

<div class="min-h-screen flex flex-col">
<div
    class="flex-1 bg-cover bg-center 
           flex justify-center items-center
           px-5 sm:px-10 lg:px-28
           py-6 sm:py-8"
    style="background-image: url('{% static "images/background.jpg" %}');"
>

    <!-- Login Card -->
    <main class="w-full max-w-sm bg-blue-200 rounded-xl shadow-lg p-5 sm:p-6">

        <!-- Heading -->
        <div class="text-center mb-5">

            <h1 class="text-2xl font-bold text-blue-600">
                Login
            </h1>

            <p class="text-xs text-gray-500 mt-1">
                Login to your account
            </p>

        </div>


        <!-- Signup -->
        <div class="text-center text-xs mb-5">

            <span class="text-gray-500">
                Don't have an account?
            </span>

            <a
                href="{% url 'signup' %}"
                class="text-blue-600 font-semibold hover:underline ml-1"
            >
                Signup
            </a>

        </div>


        <!-- Login Form -->
        <form method="post" class="space-y-4">

            {% csrf_token %}


            <!-- Username -->
            <div>

                <label
                    for="username"
                    class="block text-xs font-semibold
                           text-gray-700 mb-1"
                >
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    name="username"
                    required
                    minlength="3"
                    placeholder="Enter username"
                    autocomplete="username"
                    class="w-full px-3 py-2 text-sm
                           border border-gray-300 rounded-md
                           outline-none
                           focus:border-blue-500
                           focus:ring-1 focus:ring-blue-300"
                >

            </div>


            <!-- Password -->
            <div>

                <label
                    for="password"
                    class="block text-xs font-semibold
                           text-gray-700 mb-1"
                >
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    minlength="8"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    class="w-full px-3 py-2 text-sm
                           border border-gray-300 rounded-md
                           outline-none
                           focus:border-blue-500
                           focus:ring-1 focus:ring-blue-300"
                >

            </div>


            <!-- Error Message -->
            {% if error_message %}

            <div
                class="bg-red-50 border border-red-200
                       text-red-600 text-xs
                       px-3 py-2 rounded-md"
            >
                {{ error_message }}
            </div>

            {% endif %}


            <!-- Login Button -->
            <button
                type="submit"
                class="w-full bg-blue-600
                       text-white text-sm font-semibold
                       py-2 rounded-md
                       hover:bg-blue-700
                       active:scale-[0.98]
                       transition"
            >
                Login
            </button>

        </form>


    </main>

</div>

</div>

{% endblock content %}
