{% load static %}

<!-- Hero Section -->
<section class="bg-gradient-to-r from-blue-50 to-white py-16">

    <div class="max-w-7xl mx-auto px-6">

        <!-- Main Flex Container -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-10">

            <!-- Left Content -->
           <div class="w-full md:w-1/2 text-center md:text-left">

    <p class="text-sm font-bold tracking-widest text-blue-600">
        PREMIUM SPORTSWEAR
    </p>

    <h2 class="mt-3 text-4xl md:text-6xl font-extrabold text-gray-900 leading-tight">
        TRAIN HARD.
        <br>
        <span class="text-blue-600">
            PERFORM BETTER.
        </span>
    </h2>

    <p class="mt-6 text-gray-600 text-lg leading-relaxed max-w-xl">
        Premium sportswear designed for athletes.
        Experience superior comfort, modern style,
        and performance in every movement.
    </p>

    <a
        href="{% url 'list_products' %}"
        class="inline-block mt-8 bg-black text-white
               px-8 py-3 rounded-full font-semibold
               hover:bg-blue-600
               transition duration-300
               shadow-lg"
    >
        SHOP COLLECTION &#8594;
    </a>

</div>

            <!-- Right Image -->
            <div class="w-full md:w-1/2 flex justify-center md:justify-end">

                <img
                    src="{% static 'images/homeimg.jpg' %}"
                    alt="Workout"
                    class="w-full max-w-lg object-contain
                           hover:scale-105 transition duration-500"
                >

            </div>

        </div>

    </div>

</section>
